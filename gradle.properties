# Project-wide Gradle settings.
# Tuned for a 4-core / 8 GB machine: one JVM, in-process Kotlin compilation,
# limited worker count. Raise these if you build on a beefier machine.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

# Compile Kotlin inside the Gradle daemon instead of forking a second JVM.
kotlin.compiler.execution.strategy=in-process

# Configuration cache avoids re-running the configuration phase.
org.gradle.configuration-cache=true

# AGP 9 compiles Kotlin itself ("built-in Kotlin"). KSP registers its generated
# sources through the kotlin.sourceSets DSL, which AGP rejects unless this flag
# is set to false. Room's annotation processor needs it.
android.disallowKotlinSourceSets=false

# AndroidX is the only support library stack used by this app.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Signing: the release APK you hand to your friends is signed with a
# self-signed key. Keep whatscraft-release.jks - Android only accepts updates
# signed with the same key. The keystore and its passwords are deliberately
# NOT in this repository; put them in ~/.gradle/gradle.properties instead:
#
#   whatscraft.storeFile=/absolute/path/to/whatscraft-release.jks
#   whatscraft.storePassword=...
#   whatscraft.keyAlias=...
#   whatscraft.keyPassword=...
#
# Without them `assembleRelease` fails; debug builds need nothing.
# ---------------------------------------------------------------------------
